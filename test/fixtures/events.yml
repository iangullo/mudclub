# test/fixtures/events.yml
# Event.kind enum: rest=0, train=1, match=2
# location_id and club_id are NOT NULL; team_id is nullable but populated
# for every fixture here since that's what real events look like.

train_north:
  name: "Northside training"
  kind: train
  start_time: <%= 1.week.from_now.beginning_of_hour %>
  end_time: <%= 1.week.from_now.beginning_of_hour + 1.hour %>
  location: home_court
  club: north
  team: north_senior
  home: false

match_north:
  name: "Northside vs Southside"
  kind: match
  start_time: <%= 2.weeks.from_now.beginning_of_hour %>
  end_time: <%= 2.weeks.from_now.beginning_of_hour + 2.hours %>
  location: home_court
  club: north
  team: north_senior
  home: true

rest_north:
  name: "Northside rest day"
  kind: rest
  start_time: <%= 3.weeks.from_now.beginning_of_hour %>
  end_time: <%= 3.weeks.from_now.beginning_of_hour + 8.hours %>
  location: indoor_gym
  club: north
  team: north_senior
  home: false
