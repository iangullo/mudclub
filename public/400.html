  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
      color: #111827;
    }

    header {
      flex: none;
      width: 100%;
      height: 3.5rem;
      background-color: #1e3a8a;
      color: #d1d5db;
    }

    nav {
      max-width: 80rem;
      height: 100%;
      margin: 0 auto;
      padding: 0 1rem;
      display: flex;
      align-items: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      color: #d1d5db;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
    }

    .brand svg {
      height: 2rem;
      width: auto;
      background: #ffffff;
      border-radius: 9999px;
      padding: 2px;
    }

    .brand span {
      margin-left: 0.375rem;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      width: 100%;
      max-width: 28rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      padding: 2rem;
      text-align: center;
    }

    .code {
      font-size: 0.875rem;
      font-weight: 600;
      color: #1e3a8a;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 0.9375rem;
      color: #4b5563;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      background-color: #1e3a8a;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.875rem;
      text-decoration: none;
    }

    .btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <a href="/" class="brand">
        <svg viewBox="0 0 128 128" aria-hidden="true">
          <path fill="#532300"
            d="M43 10c-5 0-8 4-7 10 1 6 5 11 9 11 4 0 6-4 5-10-1-6-3-11-7-11zm54 9c-3 0-6 3-7 7-1 4 0 7 3 7 3 0 6-3 7-7 1-4 0-7-3-7zM17 40c-2 0-4 3-4 6 0 4 2 6 4 6 3 0 5-2 5-6 0-3-2-6-5-6zm84-8c-8 10-18 18-30 21-10 2-19-1-25-7-4 6-11 9-18 8-5-1-8-4-10-8-1 6-1 13 1 20 5 17 21 29 41 29 22 0 40-15 44-35 2-9 0-19-3-28zm-69 32c5 6 13 9 22 7 7-1 13-5 17-10 3 5 9 8 15 8 5 0 10-2 13-5-3 13-16 23-32 23-17 0-31-10-35-23zm-4 27c-8 4-13 9-13 15 0 10 22 18 49 18s49-8 49-18c0-6-5-11-13-15 4 3 6 6 6 9 0 7-19 13-42 13s-42-6-42-13c0-3 2-6 6-9z" />
        </svg>
        <span>MudClub</span>
      </a>
    </nav>
  </header>
  <main>
    <div class="card">
      <div class="code">400</div>
      <h1>Bad Request</h1>
      <p>The request could not be processed. Please check your input and try again.</p>
      <a href="/" class="btn">Back to Home</a>
    </div>
  </main>
</body>

</html>
