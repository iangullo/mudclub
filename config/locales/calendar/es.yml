# config/locales/calendar/es.yml
# -----------------------------------------------------------------------------
# MudClub
#
# Dominio de calendario
#
# Traducciones canónicas para el dominio de Calendario.
#
# El calendario proporciona servicios de programación compartidos por el resto
# de la aplicación. Los dominios de negocio (Entrenamiento, Competición,
# Comunicación, etc.) programan sus propias actividades a través de eventos.
#
# Las claves de compatibilidad heredadas se conservan al final de este archivo
# durante la migración v2 y no deben usarse en código nuevo.
# -----------------------------------------------------------------------------
es:
  calendar:
    label:
      single: Calendario
      plural: Calendarios
      short: Cal.
    fields:
      start: Inicio
      end: Fin
      date: Fecha
      date_short: Fecha
      time: Hora
      time_short: Hora
      hour: Hora
      hour_short: Hora
      mins: mins.
      mins_short: Mins.
      day: Día
      week: Semana
      week_short: Sem.
      month: Mes
      month_short: Mes
      year: Año
      year_short: Año
      since: Desde
      until: Hasta
    values:
      daynames:
        [Todos, Lunes, Martes, Miércoles, Jueves, Viernes, Sábado, Domingo]
      daynames_short: [Todos, Lun, Mar, Mié, Jue, Vie, Sáb, Dom]
      monthnames:
        [
          Todos,
          Enero,
          Febrero,
          Marzo,
          Abril,
          Mayo,
          Junio,
          Julio,
          Agosto,
          Septiembre,
          Octubre,
          Noviembre,
          Diciembre,
        ]
      monthnames_short:
        [Todos, Ene, Feb, Mar, Abr, May, Jun, Jul, Ago, Sep, Oct, Nov, Dic]

    attendance:
      gender: female
      label:
        single: Asistencia
        plural: Asistencias
        short: Asist.
      fields:
        person: Persona
        event: Evento
        status: Estado
        notes: Notas
        weekly: Sem.
        monthly: Mes
      messages:
        created: Asistencia registrada.
        updated: Asistencia actualizada.
        deleted: Asistencia eliminada.

    attendance_statuses:
      label:
        single: Estado de asistencia
        plural: Estados de asistencia
        short: Estado
      values:
        present: Presente
        absent: Ausente
        absent_female: Ausente
        excused: Justificado
        excused_female: Justificada
        late: Llegada tarde
        unknown: Desconocido
        unknown_female: Desconocida

    event_kinds:
      label:
        single: Tipo de evento
        plural: Tipos de evento
        short: Tipo
      values: &event_kind_values
        holiday: Festivo
        holiday_short: Fest.
        training: Entrenamiento
        training_short: Entren.
        match: Partido
        match_short: Part.
        competition: Competición
        competition_short: Comp.
        meeting: Reunión
        meeting_short: Reun.
        rest: Descanso
        rest_short: Desc.
        social: Evento social
        social_short: Soc.
        other: Otro
        other_short: Otro

    event:
      label:
        single: Evento
        plural: Eventos
        short: Evento
      actions:
        add: Añadir al calendario
        export: Exportar calendario
      fields:
        title: Título
        description: Descripción
        starts_on: Inicio
        ends_on: Fin
        slot: Franja horaria
        kind: Tipo de evento
        metadata: Metadatos
      kind: *event_kind_values
      messages:
        created: "%{kind} creado"
        exported: "%{kind} exportado"
        updated: "%{kind} actualizado"
        deleted: "%{kind} eliminado"

    recurrence_kinds:
      gender: female
      label:
        single: Repetición
        plural: Repeticiones
        short: Rep.
      values:
        none: Ninguna
        daily: Diaria
        weekly: Semanal
        monthly: Mensual
        yearly: Anual

    slot:
      label:
        single: Horario
        plural: Horarios
        short: Hora.
      actions:
        new: Nuevo horario
        create: Crear horario
        edit: Editar horario
        update: Actualizar horario
        delete: Borrar horario
      fields:
        starts_on: Inicio
        starts_on_short: Inicio
        ends_on: Fin
        ends_on_short: Fin
        duration: Duración
        duration_short: Dur.
      messages:
        created: Horario creado.
        updated: Horario actualizado.
        deleted: Horario eliminado.
