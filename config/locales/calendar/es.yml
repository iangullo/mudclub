# config/locales/calendar/es.yml
# -----------------------------------------------------------------------------
# MudClub
#
# Dominio de calendario
#
# Traducciones canónicas para el dominio de calendario.
#
# El calendario proporciona servicios de planificación compartidos por el resto
# de la aplicación. Los dominios (Entrenamiento, Competición, Comunicación, ...)
# planifican sus propias actividades a través de eventos de calendario.
#
# Las claves de compatibilidad heredadas se conservan al final de este archivo
# durante la migración a la versión v2 y no deben utilizarse en código nuevo.
# -----------------------------------------------------------------------------

