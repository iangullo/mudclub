    default_rival: <Rival>
    home: Local
    lost: P
    rival: Rival
    roster: Jugadores activos
    single: Partido
    won: G

    att_check: "Lista de jugadores: "
    created: "Partido creado: "
    deleted: "Partido eliminado: "
    updated: "Partido actualizado: "

    many: Partidos

  # -----------------------------------------------------------------------------
