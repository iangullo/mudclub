# config/locales/calendar/es.yml
# -----------------------------------------------------------------------------
# MudClub
#
# Dominio de calendario
#
# Traducciones canónicas para el dominio de Calendario.
#
# El calendario proporciona servicios de programación compartidos por el resto
# de la aplicación. Los dominios de negocio (Entrenamiento, Competición,
# Comunicación, etc.) programan sus propias actividades a través de eventos.
#
# Las claves de compatibilidad heredadas se conservan al final de este archivo
# durante la migración v2 y no deben usarse en código nuevo.
# -----------------------------------------------------------------------------

es:
  calendar:
    label: Calendario
    short: Cal.

    fields:
      date: Fecha
      date_short: Fecha
      time: Hora
      time_short: Hora
      week: Semana
      week_short: Sem.
      month: Mes
      month_short: Mes
      year: Año
      year_short: Año
      since: Desde
      until: Hasta

    months:
      label: Mes
      short: Mes
      values:
        january: Enero
        january_short: Ene
        february: Febrero
        february_short: Feb
        march: Marzo
        march_short: Mar
        april: Abril
        april_short: Abr
        may: Mayo
        may_short: May
        june: Junio
        june_short: Jun
        july: Julio
        july_short: Jul
        august: Agosto
        august_short: Ago
        september: Septiembre
        september_short: Sep
        october: Octubre
        october_short: Oct
        november: Noviembre
        november_short: Nov
        december: Diciembre
        december_short: Dic

    weekdays:
      label: Día de la semana
      short: Día
      values:
        monday: Lunes
        monday_short: Lun
        tuesday: Martes
        tuesday_short: Mar
        wednesday: Miércoles
        wednesday_short: Mié
        thursday: Jueves
        thursday_short: Jue
        friday: Viernes
        friday_short: Vie
        saturday: Sábado
        saturday_short: Sáb
        sunday: Domingo
        sunday_short: Dom

    event_kinds:
      label: Tipo de evento
      short: Tipo
      values:
        holiday: Festivo
        holiday_short: Fest.
        training: Entrenamiento
        training_short: Entren.
        match: Partido
        match_short: Part.
        competition: Competición
        competition_short: Comp.
        meeting: Reunión
        meeting_short: Reun.
        rest: Descanso
        rest_short: Desc.
        social: Evento social
        social_short: Soc.
        other: Otro
        other_short: Otro

    attendance_statuses:
      label: Estado de asistencia
      short: Estado
      values:
        present: Presente
        absent: Ausente
        excused: Justificado
        late: Llegada tarde
        unknown: Desconocido

    recurrence_kinds:
      label: Repetición
      short: Rep.
      values:
        none: Ninguna
        daily: Diaria
        weekly: Semanal
        monthly: Mensual
        yearly: Anual

    slot:
      label: Horario
      plural: Horarios
      short: Hora.
      actions:
        create: Crear horario
        edit: Editar horario
      fields:
        starts_on: Inicio
        starts_on_short: Inicio
        ends_on: Fin
        ends_on_short: Fin
        duration: Duración
        duration_short: Dur.
      messages:
        created: Horario creada.
        updated: Horario actualizado.
        deleted: Horario eliminado.

    event:
      label: Evento
      short: Evento
      fields:
        title: Título
        description: Descripción
        starts_on: Inicio
        ends_on: Fin
        slot: Franja horaria
        kind: Tipo de evento
        metadata: Metadatos
      messages:
        created: Evento creado.
        updated: Evento actualizado.
        deleted: Evento eliminado.

    attendance:
      label: Asistencia
      short: Asist.
      fields:
        person: Persona
        event: Evento
        status: Estado
        notes: Notas
      messages:
        created: Asistencia registrada.
        updated: Asistencia actualizada.
        deleted: Asistencia eliminada.

    # -----------------------------------------------------------------------------
    # OBSOLETO - NO MODIFICAR
    #
    # Claves de compatibilidad conservadas durante la migración v2.
    #
    # Buscar:
    #
    #   t(calendar.
    #   t(event.
    #   t(slot.
    #   t(match.
    #   t(rest.
    #
    # Eliminar una vez que todas las referencias se hayan migrado.
    # -----------------------------------------------------------------------------
    date: Fecha
    daynames:
      [Todos, Lunes, Martes, Miércoles, Jueves, Viernes, Sábado, Domingo]

    daynames_a: [Todos, Lun, Mar, Mié, Jue, Vie, Sáb, Dom]

    end: Fin

    mins: min.

    monthnames:
      [
        Todos,
        Enero,
        Febrero,
        Marzo,
        Abril,
        Mayo,
        Junio,
        Julio,
        Agosto,
        Septiembre,
        Octubre,
        Noviembre,
        Diciembre,
      ]

    monthnames_a:
      [Todos, Ene, Feb, Mar, Abr, May, Jun, Jul, Ago, Sep, Oct, Nov, Dic]

    start: Inicio

    time: Hora

    week: Semana

    year: Año

  event:
    single: Evento
    many: Eventos

  slot:
    single: Franja horaria

    created: "Franja horaria creada: "
    updated: "Franja horaria actualizada: "
    deleted: "Franja horaria eliminada: "

    edit: Editar Franja horaria
    many: Horario
    new: Crear Franja horaria

