# config/locales/calendar/en.yml
# -----------------------------------------------------------------------------
# MudClub
#
# Calendar domain
#
# Canonical translations for the Calendar domain.
#
# Calendar provides scheduling services shared by the rest of the application.
# Business domains (Training, Competition, Communication, etc.) schedule
# their own activities through calendar events.
#
# Legacy compatibility keys are preserved at the end of this file during the
# v2 migration and should not be used in new code.
# -----------------------------------------------------------------------------
en:
  calendar:
    label:
      single: Calendar
      short: Cal.
    fields:
      start: Start
      end: End
      date: Date
      date_short: Date
      time: Time
      time_short: Time
      hour: Hour
      hour_short: Hour
      minute: Minute
      minute_short: Min.
      mins: mins.
      day: Day
      week: Week
      week_short: Wk.
      month: Month
      month_short: Mon.
      year: Year
      year_short: Yr.
      since: Since
      until: Until
    values:
      daynames:
        [All, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
      daynames_short: [All, Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      monthnames:
        [
          All,
          January,
          February,
          March,
          April,
          May,
          June,
          July,
          August,
          September,
          October,
          November,
          December,
        ]
      monthnames_short:
        [All, Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]

    attendance:
      label: Attendance
      short: Attend.
      fields:
        person: Person
        event: Event
        status: Status
        notes: Notes
        weekly: Sem.
        monthly: Mes
      messages:
        created: Attendance recorded.
        updated: Attendance updated.
        deleted: Attendance removed.

    attendance_statuses:
      label: Attendance status
      short: Status
      values:
        present: Present
        absent: Absent
        excused: Excused
        late: Late
        unknown: Unknown

    event_kinds:
      label: Event kind
      short: Kind
      values: &event_kind_values # anchor
        holiday: Holiday
        holiday_short: Hol.
        training: Training
        training_short: Train
        match: Match
        match_short: Match
        competition: Competition
        competition_short: Comp.
        meeting: Meeting
        meeting_short: Meet
        rest: Rest
        rest_short: Rest
        social: Social event
        social_short: Soc.
        other: Other
        other_short: Other

    event:
      label:
        single: Event
        plural: Events
        short: Event
      actions:
        add: Add to calendar
        export: Export calendar
      fields:
        title: Title
        description: Description
        starts_on: Starts
        ends_on: Ends
        slot: Time slot
        kind: Event kind
        metadata: Metadata
      kind: *event_kind_values # reference
      messages:
        created: "%{kind} created"
        exported: "%{kind} exported"
        updated: "%{kind} updated"
        deleted: "%{kind} deleted"

    recurrence_kinds:
      label: Recurrence
      short: Rec.
      values:
        none: None
        daily: Daily
        weekly: Weekly
        monthly: Monthly
        yearly: Yearly

    slot:
      label:
        single: Time slot
        plural: Time table
        short: Slot
      actions:
        new: New timeslot
        create: Create timeslot
        edit: Edit timeslot
        update: Update timeslot
        delete: Delete timeslot
      fields:
        starts_on: Starts
        starts_on_short: Start
        ends_on: Ends
        ends_on_short: End
        duration: Duration
        duration_short: Dur.
      messages:
        created: Time slot created.
        updated: Time slot updated.
        deleted: Time slot deleted.
