        # Identidad
        server_name: Nombre del servidor
        server_name_hint: Aparece en la pestaña del navegador y en la barra superior cuando no hay club activo.
        support_email: Correo de soporte
        support_email_hint: Dirección de contacto principal. Se usa como respuesta en los correos salientes.

        # Idioma
        default_locale: Idioma por defecto
        default_locale_hint: Se aplica a visitantes anónimos. Los usuarios registrados ven su preferencia.
        available_locales: Idiomas disponibles
        available_locales_hint: Idiomas que los usuarios pueden elegir. El idioma por defecto debe estar incluido.
        time_zone: Zona horaria
        time_zone_hint: Valor por defecto del servidor. Los usuarios pueden sobrescribirlo.
        date_format: Formato de fecha
        date_format_hint: Se aplica a las fechas en todo el servidor. El patrón se adapta al idioma activo.

        # Módulos
        modules: Módulos
        modules_hint: Las funciones básicas están siempre activas. Los módulos opcionales pueden desactivarse.
        disabled_modules: Módulos opcionales
        disabled_modules_hint: Al desmarcar un módulo se desactivan también sus dependientes.

        # Solicitudes
        registrations_enabled: Permitir solicitudes de inscripción
        registrations_enabled_hint: Interruptor global. Cada club puede rechazarlas individualmente.
        registrations_require_terms: Requerir aceptación de términos
