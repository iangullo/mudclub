        registrations_terms_url: URL de los términos del servicio
        registrations_terms_url_hint: Enlazada desde el formulario de solicitud.
        registrations_privacy_url: URL de la política de privacidad
        registrations_privacy_url_hint: Enlazada desde el formulario de solicitud.

        # Public pages
        public_clubs_enabled: Habilitar páginas públicas de club
        public_clubs_enabled_hint: Permite a los clubes publicar una vista general y aceptar visitantes anónimos.
        public_directory_enabled: Publicar directorio de clubes
        public_directory_enabled_hint: Lista los clubes participantes en la página de inicio.

        # Email
        email_from: Dirección del remitente
        email_from_hint: Los correos1 salientes aparecen enviados desde esta dirección.
        email_reply_to: Dirección de respuesta
        email_reply_to_hint: Las respuestas se dirigen aquí en lugar de al remitente.
        email_signature: Firma del correo
        email_signature_hint: Añadida al final de los correos salientes. Texto plano o HTML simple.

