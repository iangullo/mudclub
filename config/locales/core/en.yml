      fields:
        # Software description
        about: About ...
        build: Build #
        info-1: "The open source Rails platform to manage"
        info-2: "amateur sports clubs:"
        info-3: "Clubs: members, admissions, time tables."
        info-4: "Teams: rosters, targets, events, etc."
        info-5: "Training: planning, drills, plays, sessions."
        info-6: "Matches: outings/stats & results."
        published: "Published under GNU Affero GPLv3 license"
        tagline: "The open source Rails platform to manage amateur sports clubs."
        website: MudClub wiki
        log: Logs

        # Identity
        server_name: MudClub
        server_name_hint: Shown in the browser tab and top bar when no club is active.
        support_email: Support email
        support_email_hint: Primary contact address. Used as reply-to on outgoing email.

        # Localization
        default_locale: Default language
        default_locale_hint: Applied to anonymous visitors. Signed-in users see their own preference.
        available_locales: Available languages
        available_locales_hint: Languages users can choose from. The default must be one of them.
        time_zone: Time zone
        time_zone_hint: Server-wide default. Individual users may override.
        date_format: Date format
        date_format_hint: Applies to dates across the server. Patterns adapt to the active language.

        # Modules
        modules: Modules
        modules_hint: Core features are always on. Optional modules can be disabled.
        disabled_modules: Optional modules
        disabled_modules_hint: Unchecking a module also disables anything that depends on it.

        # Admission
        registrations_enabled: Allow registration requests
        registrations_enabled_hint: Server-wide switch. Individual clubs may still refuse.
        registrations_require_terms: Require acceptance of terms
        registrations_require_terms_hint: Requesters must accept the terms before submitting.
        registrations_terms_url: Terms of service URL
        registrations_terms_url_hint: Linked from the submission form.
        registrations_privacy_url: Privacy policy URL
        registrations_privacy_url_hint: Linked from the submission form.

        # Public pages
        public_clubs_enabled: Enable public club pages
        public_clubs_enabled_hint: Allow clubs to publish an overview and accept anonymous visitors.
        public_directory_enabled: Publish club directory
        public_directory_enabled_hint: List participating clubs on the home page.

        # Email
        email_from: Sender address
        email_from_hint: Outgoing mail appears to come from this address.
        email_reply_to: Reply-to address
        email_reply_to_hint: Replies are routed here instead of the sender address.
        email_signature: Email signature
        email_signature_hint: Appended to outgoing emails. Plain text or simple HTML.

      # ─── Enum labels ─────────────────────────────────────────
      # Used by selects and radio groups on the settings form.
      formats:
        default: Default
        short: Short
        long: Long
        numeric: Numeric

      # ─── Status / flash messages ─────────────────────────────
      messages:
